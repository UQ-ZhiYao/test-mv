<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZY-Invest">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://wvaibdjkjnnesefantjc.supabase.co" crossorigin>
<title>ZY-Invest — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
button,a{touch-action:manipulation;}
:root{
  --blue:#1565C0;--blue-dark:#0D47A1;--blue-light:#1E88E5;
  --fg-1:#0F172A;--fg-2:#374151;--fg-3:#64748B;
  --border:#E2E8F0;--gray-50:#F8FAFC;
  --font-body:'DM Sans',sans-serif;--font-display:'DM Serif Display',serif;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:var(--font-body);background:#0D47A1;
  touch-action:pan-y;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input,textarea{-webkit-user-select:text;user-select:text;}

.app{
  display:flex;flex-direction:column;height:100%;height:100dvh;
  max-width:430px;margin:0 auto;
  position:relative;overflow:hidden;
  background:linear-gradient(170deg,#0D47A1 0%,#1565C0 40%,#1E88E5 100%);
}
.bg-circle-1{position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.06);top:-80px;right:-80px;pointer-events:none;}
.bg-circle-2{position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-60px;left:-60px;pointer-events:none;}

.top-bar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-top) + 18px) 24px 0;
  position:relative;z-index:1;
}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-wrap img{width:30px;height:30px;}
.logo-txt{color:#fff;}
.logo-txt b{display:block;font-size:.88rem;font-weight:700;letter-spacing:-.01em;}
.logo-txt span{display:block;font-size:.64rem;opacity:.7;margin-top:1px;}

.content-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:2;
  padding:24px 24px calc(var(--safe-bottom) + 24px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.card{
  background:#fff;
  border-radius:24px;
  padding:32px 26px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.fp-state{display:none;}
.fp-state.show{display:block;}
.fp-state.center{text-align:center;}
.fp-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;background:#EFF6FF;}
.fp-icon svg{width:32px;height:32px;stroke:var(--blue);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.card-title{font-size:1.05rem;font-weight:700;color:var(--fg-1);margin-bottom:8px;}
.fp-state.center .card-title{text-align:center;}
.card-sub{font-size:.84rem;color:var(--fg-3);line-height:1.6;margin-bottom:22px;}
.fp-state.center .card-sub{text-align:center;}

.field{margin-bottom:16px;text-align:left;}
.field label{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:6px;}
.field input{
  width:100%;font:inherit;font-size:.95rem;color:var(--fg-1);
  background:var(--gray-50);border:1.5px solid var(--border);border-radius:12px;
  padding:13px 14px;outline:none;transition:.2s;
}
.field input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(21,101,192,.1);}
.field input::placeholder{color:#94A3B8;}

.btn-login{
  width:100%;padding:15px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-light) 100%);
  color:#fff;font:inherit;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:.2s;
  box-shadow:0 6px 20px rgba(21,101,192,.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;
}
.btn-login:active{transform:scale(.98);}
.btn-login:disabled{opacity:.6;}
.btn-login .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.error-msg{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;font-size:.78rem;font-weight:600;padding:10px 13px;border-radius:10px;margin-bottom:14px;display:none;text-align:left;}
.error-msg.show{display:block;}

.note-msg{font-size:.78rem;font-weight:600;padding:10px 13px;border-radius:10px;margin-top:14px;display:none;text-align:center;}
.note-msg.show{display:block;}
.note-msg.ok{background:#F0FDF4;color:#2E7D32;}
.note-msg.err{background:#FEF2F2;color:#DC2626;}

.card-footer{margin-top:22px;text-align:center;font-size:.78rem;}
.card-footer a{color:rgba(255,255,255,.85);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="app">

  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>

  <div class="top-bar">
    <div class="logo-wrap">
      <img src="../assets/img/logo.png" alt="ZY-Invest">
      <div class="logo-txt"><b>ZY-Invest</b><span data-i18n="login.memberPortal">Member Portal</span></div>
    </div>
  </div>

  <div class="content-wrap">
    <div class="card">

      <!-- Request state — enter email -->
      <div class="fp-state show" id="fpForm">
        <div class="card-title" data-i18n="forgotpw.title">Forgot Password?</div>
        <div class="card-sub" data-i18n="forgotpw.sub">Enter the email address on your account and we'll send you a link to reset your password.</div>

        <div class="error-msg" id="fpErr"></div>

        <div class="field">
          <label data-i18n="login.emailLabel">Email Address</label>
          <input type="email" id="fpEmail" placeholder="your@email.com" data-i18n-placeholder="login.emailPlaceholder" autocomplete="email" onkeydown="if(event.key==='Enter')fpSubmit()">
        </div>

        <button class="btn-login" id="fpSubmitBtn" onclick="fpSubmit()">
          <span id="fpSubmitTxt" data-i18n="forgotpw.sendLink">Send Reset Link</span>
          <div class="spinner" id="fpSpinner"></div>
        </button>
      </div>

      <!-- Sent state -->
      <div class="fp-state center" id="fpSent">
        <div class="fp-icon">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div class="card-title" data-i18n="forgotpw.checkInboxTitle">Check Your Email</div>
        <div class="card-sub"><span data-i18n="forgotpw.checkInboxSubPrefix">We've sent a password reset link to</span> <b id="fpSentEmail" style="color:var(--fg-1);">your email</b>. <span data-i18n="verify.tapLinkThenReturn">Tap the link there to activate your account, then come back here.</span></div>
        <button class="btn-login" id="fpResendBtn" data-i18n="forgotpw.resendLink">Resend Reset Link</button>
        <div class="note-msg" id="fpNote"></div>
      </div>

    </div>

    <div class="card-footer">
      <a href="login.html" data-i18n="verify.backToSignIn">← Back to Sign In</a>
    </div>
  </div>

</div>

<script src="../assets/js/i18n.js?v=21"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-auth.js"></script>
<script>
(function(){
  var states=['fpForm','fpSent'];
  function show(id){
    states.forEach(function(s){ document.getElementById(s).classList.toggle('show', s===id); });
  }

  function note(msg,isErr){
    var n=document.getElementById('fpNote');
    if(!msg){ n.classList.remove('show','ok','err'); return; }
    n.textContent=msg; n.classList.add('show'); n.classList.toggle('ok',!isErr); n.classList.toggle('err',!!isErr);
  }

  var lastEmail='';
  async function requestReset(email,btn,txtEl,spinEl){
    var tt=(typeof t==='function')?t:function(k){return k;};
    var orig=txtEl?txtEl.textContent:btn.textContent;
    btn.disabled=true;
    if(txtEl){ txtEl.textContent=tt('forgotpw.sending'); } else { btn.textContent=tt('forgotpw.sending'); }
    if(spinEl) spinEl.style.display='inline-block';
    try{
      if(typeof zyRequestPasswordReset==='undefined') throw new Error(tt('login.errAuthNotConfigured'));
      await zyRequestPasswordReset(email);
      lastEmail=email;
      try{ localStorage.setItem('zy_reset_pending_email', email); }catch(e){}
      return true;
    }catch(ex){
      console.error('[ForgotPassword] request failed:', ex);
      throw ex;
    }finally{
      btn.disabled=false;
      if(txtEl) txtEl.textContent=orig; else btn.textContent=orig;
      if(spinEl) spinEl.style.display='none';
    }
  }

  window.fpSubmit=async function(){
    var tt=(typeof t==='function')?t:function(k){return k;};
    var email=document.getElementById('fpEmail').value.trim();
    var err=document.getElementById('fpErr');
    err.classList.remove('show');
    if(!email){ err.textContent=tt('forgotpw.errEnterEmail'); err.classList.add('show'); return; }
    var btn=document.getElementById('fpSubmitBtn');
    try{
      await requestReset(email, btn, document.getElementById('fpSubmitTxt'), document.getElementById('fpSpinner'));
      document.getElementById('fpSentEmail').textContent=email;
      show('fpSent');
    }catch(ex){
      err.textContent=(ex&&ex.message)||tt('forgotpw.errGeneric');
      err.classList.add('show');
    }
  };

  document.getElementById('fpResendBtn').addEventListener('click', async function(){
    var btn=this;
    try{
      await requestReset(lastEmail, btn, null, null);
      note((typeof t==='function')?t('verify.resentSuccess'):'Sent!', false);
    }catch(ex){
      note((ex&&ex.message)||((typeof t==='function')?t('forgotpw.errGeneric'):'Something went wrong.'), true);
    }
  });
})();
</script>
</body>
</html>
